<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/password_36dp_000000_FILL0_wght400_GRAD0_opsz40.png">
    <!-- SEO -->
    <meta name="keywords" content="password generator, secure password, strong password, random password, password creator">
    <!-- description -->
    <meta name="description" content="A simple and secure password generator for creating strong and customizable passwords.">
    <!-- Author -->
    <meta name="Author" content="MahanAhmadnia">
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">

        <h1>Password Generator</h1>

        <div class="display">
            <input type="text" id="input" placeholder="Password" readonly>

            <img src="./images/content_copy_36dp_000000_FILL0_wght400_GRAD0_opsz40.png" alt="copy password" id="copy">
        </div>


        <!-- Range -->

        <div class="range">
            <input type="range" id="slider" min="6" max="33" value="21">
            <span id="output">21</span>      
        </div>


        <!-- Options -->

        <div class="options">
            <div class="section-one">
                <div class="item">
                    <input type="checkbox" class="checkbox" id="uppercase">
                    <label for="Uppercase">Uppercase(A_Z)</label>
                </div>

                <div class="item">
                    <input type="checkbox" class="checkbox" id="lowercase">
                    <label for="Lowercase">Lowercase(a_z)</label>
                </div>
            </div>

            <div class="section-two">
                <div class="item">
                    <input type="checkbox" class="checkbox" id="numbers">
                    <label for="Numbers">Numbers(0_9)</label>
                </div>
                
                <div class="item">
                    <input type="checkbox" class="checkbox" id="symbols">
                    <label for="Symbols">Symbols(!@#...)</label>
                </div>
            </div>
        </div>


        <!-- Button -->

        <button id="btn">
            <img src="./images/bolt_36dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.png" alt="icon">GENERATE PASSWORD
        </button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
