<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./images/password_36dp_000000_FILL0_wght400_GRAD0_opsz40.png">
    <!-- SEO -->
    <meta name="keywords" content="password generator, secure password generator, strong password, random password, password creator">
    <!-- description -->
    <meta name="description" content="Generate strong and secure random passwords with customizable length, uppercase letters, lowercase letters, numbers, and symbols.">
    <!-- Author -->
    <meta name="Author" content="MahanAhmadnia">
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">

        <h1>Password Generator</h1>

        <div class="display-section">
            <input type="text" id="display" placeholder="Password" readonly>

            <img src="./images/content_copy_36dp_000000_FILL0_wght400_GRAD0_opsz40.png" alt="copy password" id="copy">
        </div>


        <!-- Range -->

        <div class="range">
            <input type="range" id="slider" min="6" max="15" value="10">
            <span id="output">10</span>    
        </div>


        <!-- Options -->

        <div class="options">

            <div class="section-one">
                <div class="item">
                    <input type="checkbox" class="checkbox" id="uppercase">
                    <label for="uppercase">Uppercase (A_Z)</label>
                </div>

                <div class="item">
                    <input type="checkbox" class="checkbox" id="lowercase">
                    <label for="lowercase">Lowercase (a_z)</label>
                </div>
            </div>

            <div class="section-two">
                <div class="item">
                    <input type="checkbox" class="checkbox" id="numbers">
                    <label for="numbers">Numbers (0_9)</label>
                </div>
                    
                <div class="item">
                    <input type="checkbox" class="checkbox" id="symbols">
                    <label for="symbols">Symbols (!@#...)</label>
                </div>
            </div>
        </div>


        <!-- Button -->

        <button id="btn">
            <img src="./images/bolt_36dp_FFFFFF_FILL0_wght400_GRAD0_opsz40.png" alt="icon">GENERATE PASSWORD
        </button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
